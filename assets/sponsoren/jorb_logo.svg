<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <defs>
    <linearGradient id="jorbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB703" />
      <stop offset="100%" stop-color="#FB8500" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Hexagonal Shield Emblem -->
  <g transform="translate(6, 6)">
    <polygon points="50,0 100,28 100,84 50,112 0,84 0,28" fill="url(#bgGrad)" stroke="url(#jorbGrad)" stroke-width="4.5"/>
    
    <!-- Roof / Apex beam -->
    <path d="M22,42 L50,22 L78,42" stroke="url(#jorbGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Stylized J -->
    <path d="M38,38 L38,72 A10,10 0 0,1 28,82 A10,10 0 0,1 20,78" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" fill="none"/>
    
    <!-- Stylized B -->
    <path d="M56,38 L56,84" stroke="url(#jorbGrad)" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M56,40 C68,40 76,46 76,56 C76,64 68,64 56,64" stroke="url(#jorbGrad)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M56,64 C70,64 78,72 78,78 C78,84 68,84 56,84" stroke="url(#jorbGrad)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Text "JorB" -->
  <text x="126" y="68" font-family="'Avenir Next', 'Arial Black', sans-serif" font-size="58" font-weight="900" letter-spacing="-1">
    <tspan fill="#FFFFFF">Jor</tspan><tspan fill="url(#jorbGrad)">B</tspan>
  </text>

  <!-- "PROJECTEN" Pill -->
  <rect x="128" y="80" width="160" height="24" rx="6" fill="rgba(251, 133, 0, 0.18)" stroke="rgba(251, 133, 0, 0.45)" stroke-width="1.2"/>
  <text x="208" y="96.5" font-family="'Avenir Next', sans-serif" font-size="12.5" font-weight="850" fill="#FFB703" letter-spacing="3.5" text-anchor="middle">
    PROJECTEN
  </text>

  <text x="304" y="96.5" font-family="'Avenir Next', sans-serif" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="1.2">
    BOUW • TUINEN • TRANSPORT
  </text>
</svg>