<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>VOKO Digital Signage - Agenda</title>
  
  <!-- Montserrat voor de karakteristieke strakke, zware typografie conform het nieuwe kalender-ontwerp -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Vaste 16:9 canvas container met automatische responsieve schaling */
    #viewport-scaler {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-color: #000000;
    }

    #slide-canvas {
      width: 1920px;
      height: 1080px;
      min-width: 1920px;
      min-height: 1080px;
      max-width: 1920px;
      max-height: 1080px;
      position: relative;
      background: #ffffff url('assets/agenda_bg.jpg') no-repeat center center / cover;
      transform-origin: center center;
      overflow: hidden;
    }

    /* Rode brush-script "Agenda" titel */
    .agenda-title-img {
      position: absolute;
      top: 72px;
      left: 885px;
      width: 326px;
      height: auto;
      display: block;
      user-select: none;
    }

    /* Lijst met de 6 eerstvolgende agenda-items */
    .agenda-list {
      position: absolute;
      top: 300px;
      left: 885px;
      right: 60px;
      display: flex;
      flex-direction: column;
      gap: 65px;
    }

    .agenda-item {
      font-size: 50px;
      font-weight: 800;
      color: #000000;
      letter-spacing: -0.5px;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: opacity 0.3s ease;
    }

    .agenda-item.fade-out {
      opacity: 0;
    }

    .agenda-sep {
      margin: 0 4px;
      font-weight: 700;
    }

    /* Subtiele diagnostische timestamp (verborgen voor publiek) */
    .signage-status {
      display: none;
    }
  </style>
</head>
<body>

  <div id="viewport-scaler">
    <div id="slide-canvas">
      
      <!-- Rode brush-script "Agenda" kop -->
      <img src="assets/agenda_title.png" alt="Agenda" class="agenda-title-img">

      <!-- Dynamische agendalijst (met pre-rendered fallback items ter voorkoming van flikkering) -->
      <div class="agenda-list" id="agenda-container">
        <div class="agenda-item"><span class="agenda-date">2 december</span><span class="agenda-sep"> - </span><span class="agenda-title">Pieten training</span></div>
        <div class="agenda-item"><span class="agenda-date">30 december</span><span class="agenda-sep"> - </span><span class="agenda-title">Oliebollentoernooi</span></div>
        <div class="agenda-item"><span class="agenda-date">22 januari</span><span class="agenda-sep"> - </span><span class="agenda-title">Pubquiz</span></div>
        <div class="agenda-item"><span class="agenda-date">27 februari</span><span class="agenda-sep"> - </span><span class="agenda-title">Winter BBQ</span></div>
        <div class="agenda-item"><span class="agenda-date">21 maart</span><span class="agenda-sep"> - </span><span class="agenda-title">Ouder-kind toernooi</span></div>
        <div class="agenda-item"><span class="agenda-date">10 april</span><span class="agenda-sep"> - </span><span class="agenda-title">Eindfeest</span></div>
      </div>

      <div class="signage-status" id="status-indicator">VOKO Digital Signage</div>

    </div>
  </div>

  <script>
    // -------------------------------------------------------------------------
    // 1. Automatische Schaling naar elk schermformaat (behoudt vaste 16:9 verhouding)
    // -------------------------------------------------------------------------
    function fitViewport() {
      const canvas = document.getElementById('slide-canvas');
      if (!canvas) return;
      const targetWidth = 1920;
      const targetHeight = 1080;
      const currentWidth = window.innerWidth;
      const currentHeight = window.innerHeight;

      const scale = Math.min(currentWidth / targetWidth, currentHeight / targetHeight);
      canvas.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', fitViewport);
    window.addEventListener('DOMContentLoaded', fitViewport);
    fitViewport();

    // -------------------------------------------------------------------------
    // 2. Normalisatie van activiteitstitels conform het strakke VOKO slide-ontwerp
    // -------------------------------------------------------------------------
    function formatAgendaTitle(rawTitle) {
      if (!rawTitle) return '';
      const t = rawTitle.trim();

      if (/pieten\s*training/i.test(t)) return 'Pieten training';
      if (/oliebollen\s*toernooi/i.test(t)) return 'Oliebollentoernooi';
      if (/winter\s*bbq/i.test(t)) return 'Winter BBQ';
      if (/ouder[- ]kind/i.test(t)) return 'Ouder-kind toernooi';
      if (/pubquiz/i.test(t)) return 'Pubquiz';
      if (/eindfeest/i.test(t)) return 'Eindfeest';

      // Verwijder eventuele dubbele koppelteken achtervoegsels (zoals "Activiteit - Doelgroep")
      // tenzij het titel-eigen is
      return t;
    }

    // -------------------------------------------------------------------------
    // 3. Client-Side Auto-Refresh (elke 15 minuten nieuwe agenda.json ophalen)
    // -------------------------------------------------------------------------
    const REFRESH_INTERVAL_MS = 15 * 60 * 1000; // 15 minuten
    let currentAgendaFingerprint = '';

    async function fetchAgenda() {
      try {
        const cacheBuster = Date.now();
        const response = await fetch(`agenda.json?v=${cacheBuster}`, {
          headers: { 'Accept': 'application/json' },
          cache: 'no-store'
        });

        if (!response.ok) {
          throw new Error(`HTTP fout: ${response.status}`);
        }

        const data = await response.json();
        if (!data || !Array.isArray(data.items)) {
          throw new Error('Ongeldige JSON structuur ontvangen');
        }

        const items = data.items.slice(0, 6);
        const newFingerprint = JSON.stringify(items);

        // Update DOM alleen als data daadwerkelijk is veranderd
        if (newFingerprint !== currentAgendaFingerprint) {
          updateAgendaDOM(items);
          currentAgendaFingerprint = newFingerprint;
        }

        const statusEl = document.getElementById('status-indicator');
        if (statusEl) {
          const now = new Date();
          const timeStr = now.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
          statusEl.textContent = `Bijgewerkt: ${timeStr}`;
        }
      } catch (err) {
        console.warn('Agenda refresh waarschuwing (bestaande weergave blijft behouden):', err);
      }
    }

    function updateAgendaDOM(items) {
      const container = document.getElementById('agenda-container');
      if (!container) return;

      const existingItems = container.querySelectorAll('.agenda-item');
      existingItems.forEach(el => el.classList.add('fade-out'));

      setTimeout(() => {
        container.innerHTML = '';
        items.forEach(item => {
          const itemEl = document.createElement('div');
          itemEl.className = 'agenda-item fade-out';

          const dateSpan = document.createElement('span');
          dateSpan.className = 'agenda-date';
          dateSpan.textContent = item.datum || '';

          const sepSpan = document.createElement('span');
          sepSpan.className = 'agenda-sep';
          sepSpan.textContent = ' - ';

          const titleSpan = document.createElement('span');
          titleSpan.className = 'agenda-title';
          titleSpan.textContent = formatAgendaTitle(item.titel);

          itemEl.appendChild(dateSpan);
          itemEl.appendChild(sepSpan);
          itemEl.appendChild(titleSpan);
          container.appendChild(itemEl);

          requestAnimationFrame(() => {
            itemEl.classList.remove('fade-out');
          });
        });
      }, 300);
    }

    fetchAgenda();
    setInterval(fetchAgenda, REFRESH_INTERVAL_MS);
  </script>

</body>
</html>
