<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>VOKO Digital Signage - Standen & Ranking</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="viewport-scaler">
    <div id="slide-canvas">
      
      <!-- 1. Bovenbalk met wit VOKO logo -->
      <header class="top-bar">
        <img src="assets/voko_wit.png" alt="VOKO Logo" class="voko-logo">
      </header>

      <!-- 2. Rode Banner met 'Standen & Ranking:' -->
      <div class="red-banner-wrapper">
        <svg class="banner-svg" viewBox="0 0 1920 192" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="vokoRedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#e42819" />
              <stop offset="100%" stop-color="#cb1d12" />
            </linearGradient>
          </defs>
          <path d="M 0,0 L 1920,0 L 1920,158 Q 1100,172 450,190 Q 180,192 0,176 Z" fill="url(#vokoRedGrad)" />
        </svg>
        <div class="banner-content">
          <h1 class="banner-title">Standen & Ranking:</h1>
        </div>
      </div>

      <!-- 3. Standen Stage (4 Slides: Heren, Dames, Jeugd, Volley Stars) -->
      <main class="stand-stage" id="stand-stage">
        <!-- Wordt dynamisch gevuld via standen.json -->
      </main>

      <!-- Pagina-teller en progress bar onderaan -->
      <div class="news-counter" id="stand-counter">Categorie 1 van 4</div>
      <div class="signage-status" id="status-indicator">VOKO Digital Signage • Standen (40s cyclus)</div>
      <div class="news-progress-bar-container">
        <div class="news-progress-bar" id="stand-progress-bar"></div>
      </div>

    </div>
  </div>

  <script>
    // -------------------------------------------------------------------------
    // 1. Automatische Schaling (1080p full-screen weergave)
    // -------------------------------------------------------------------------
    function fitViewport() {
      const canvas = document.getElementById('slide-canvas');
      if (!canvas) return;
      const targetWidth = 1920;
      const targetHeight = 1080;
      const scale = Math.min(window.innerWidth / targetWidth, window.innerHeight / targetHeight);
      canvas.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', fitViewport);
    window.addEventListener('DOMContentLoaded', fitViewport);
    fitViewport();

    // -------------------------------------------------------------------------
    // 2. Dia-Rotatie Logica: 4 slides van exact 10 seconden (40s totaal)
    // -------------------------------------------------------------------------
    const SLIDE_DURATION_MS = 10000;
    let currentSlideIndex = 0;
    let rotationTimer = null;

    function startProgressBar() {
      const bar = document.getElementById('stand-progress-bar');
      if (!bar) return;
      bar.style.transition = 'none';
      bar.style.width = '0%';
      void bar.offsetWidth;
      bar.style.transition = `width ${SLIDE_DURATION_MS}ms linear`;
      bar.style.width = '100%';
    }

    function showSlide(index) {
      const slides = document.querySelectorAll('.stand-slide');
      if (slides.length === 0) return;

      currentSlideIndex = (index + slides.length) % slides.length;

      slides.forEach((slide, i) => {
        if (i === currentSlideIndex) {
          slide.classList.add('active');
        } else {
          slide.classList.remove('active');
        }
      });

      const activeSlide = slides[currentSlideIndex];
      const categoryName = activeSlide ? activeSlide.getAttribute('data-category-name') : '';

      const counterEl = document.getElementById('stand-counter');
      if (counterEl) {
        counterEl.textContent = `Categorie ${currentSlideIndex + 1} van ${slides.length} • ${categoryName} (10s)`;
      }

      startProgressBar();
    }

    function nextSlide() {
      const slides = document.querySelectorAll('.stand-slide');
      if (slides.length <= 1) {
        startProgressBar();
        return;
      }
      showSlide(currentSlideIndex + 1);
    }

    function restartRotation() {
      if (rotationTimer) clearInterval(rotationTimer);
      startProgressBar();
      rotationTimer = setInterval(nextSlide, SLIDE_DURATION_MS);
    }

    // -------------------------------------------------------------------------
    // 3. Client-Side Auto-Refresh (fetcht standen.json elke 15 min)
    // -------------------------------------------------------------------------
    let currentFingerprint = '';

    async function fetchStanden() {
      try {
        const cacheBuster = Date.now();
        const response = await fetch(`standen.json?v=${cacheBuster}`, {
          headers: { 'Accept': 'application/json' },
          cache: 'no-store'
        });

        if (!response.ok) throw new Error(`HTTP fout: ${response.status}`);
        const data = await response.json();
        if (!data || !data.categories) return;

        const newFingerprint = JSON.stringify(data.categories);
        if (newFingerprint !== currentFingerprint) {
          currentFingerprint = newFingerprint;
          renderStandenSlides(data.categories);
        }

        const statusEl = document.getElementById('status-indicator');
        if (statusEl) {
          const now = new Date();
          const timeStr = now.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
          statusEl.textContent = `Bijgewerkt: ${timeStr} • Standen & Ranking (40s)`;
        }
      } catch (err) {
        console.warn('Standen refresh waarschuwing:', err);
      }
    }

    function renderStandenSlides(categories) {
      const stage = document.getElementById('stand-stage');
      if (!stage) return;
      stage.innerHTML = '';

      const catKeys = ['heren', 'dames', 'jeugd', 'volleystars'];
      const MAX_TEAMS_PER_SLIDE = 6;
      let totalSlidesCreated = 0;

      catKeys.forEach((key) => {
        const cat = categories[key];
        if (!cat || !Array.isArray(cat.teams) || cat.teams.length === 0) return;

        const teams = cat.teams;
        const numChunks = Math.ceil(teams.length / MAX_TEAMS_PER_SLIDE);

        for (let chunkIdx = 0; chunkIdx < numChunks; chunkIdx++) {
          const chunkTeams = teams.slice(chunkIdx * MAX_TEAMS_PER_SLIDE, (chunkIdx + 1) * MAX_TEAMS_PER_SLIDE);
          const isFirstSlide = totalSlidesCreated === 0;
          totalSlidesCreated++;

          const slide = document.createElement('article');
          slide.className = 'stand-slide' + (isFirstSlide ? ' active' : '');
          const pageSuffix = numChunks > 1 ? ` (${chunkIdx + 1}/${numChunks})` : '';
          slide.setAttribute('data-category-name', `${cat.titel || key}${pageSuffix}`);

          const isSingleRow = chunkTeams.length <= 3;
          let cardsHtml = '';
          chunkTeams.forEach(t => {
            const photoUrl = t.team_foto || 'https://www.voko-oosterhout.nl/back-site/upload/voko-oosterhout/teams/_800x600/placeholder_20241213222914264_20250817204009442.jpg';
            const standenList = (t.standen && Array.isArray(t.standen) && t.standen.length > 0)
              ? t.standen
              : [{
                  positie: t.positie,
                  positie_tekst: t.positie_tekst || (t.niveau ? '⭐' : '-'),
                  display_klasse: t.klasse || t.niveau || '',
                  label: 'Competitie',
                  type: 'competitie',
                  gespeeld: t.gespeeld || 0,
                  punten: t.punten || 0
                }];

            let blocksHtml = '';
            standenList.forEach((s, idx) => {
              const rank = parseInt(s.positie, 10);
              let rankClass = '';
              if (rank === 1) rankClass = 'rank-1';
              else if (rank === 2) rankClass = 'rank-2';
              else if (rank === 3) rankClass = 'rank-3';

              const rankDisplay = s.positie_tekst || (s.niveau ? '⭐' : '-');
              const typeClass = (s.type || 'competitie').toLowerCase().replace(/\s+/g, '_');
              const typeLabel = s.label || 'Competitie';
              const klasseName = s.display_klasse || s.klasse || '';
              const statsText = (s.gespeeld > 0 || s.punten > 0)
                ? `${s.gespeeld} gespeeld • ${s.punten} punten`
                : (s.stand_omschrijving || '');

              const isSecond = idx > 0 ? 'is-second-comp' : '';

              blocksHtml += `
                <div class="stand-comp-block ${isSecond}">
                  <div class="stand-comp-header">
                    <div class="stand-rank-badge ${rankClass}">
                      ${rankDisplay}
                    </div>
                    <span class="stand-type-pill ${typeClass}">${typeLabel}</span>
                  </div>
                  <div class="stand-comp-klasse">${klasseName}</div>
                  ${statsText ? `<div class="stand-comp-stats">${statsText}</div>` : ''}
                </div>
              `;
            });

            cardsHtml += `
              <div class="stand-team-card ${standenList.length > 1 ? 'is-multi-comp' : ''}">
                <div class="stand-card-content">
                  <div class="stand-team-title">${t.team || ''}</div>
                  <div class="stand-comp-list">
                    ${blocksHtml}
                  </div>
                </div>
                <div class="stand-card-photo-wrap">
                  <img src="${photoUrl}" alt="${t.team || ''}" class="stand-card-photo ${t.is_placeholder ? 'is-placeholder' : ''}">
                </div>
              </div>
            `;
          });

          slide.innerHTML = `
            <div class="stand-header-bar">
              <h2 class="stand-category-title">
                <span>${cat.titel || ''}${pageSuffix}</span>
                <span class="stand-category-tag">Seizoen 2026-2027</span>
              </h2>
              ${cat.ondertitel ? `<div style="font-size: 22px; color: #64748b; font-weight: 600;">${cat.ondertitel}</div>` : ''}
            </div>
            <div class="stand-grid-cards ${isSingleRow ? 'is-single-row' : ''}">
              ${cardsHtml}
            </div>
          `;

          stage.appendChild(slide);
        }
      });

      currentSlideIndex = 0;
      showSlide(0);
      restartRotation();
    }

    fetchStanden();
    setInterval(fetchStanden, 15 * 60 * 1000);
  </script>

</body>
</html>
